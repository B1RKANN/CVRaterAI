<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVRaterAI - Sign In / Sign Up</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../src/css/signİn.css">
    <link rel="stylesheet" href="../../src/css/mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&family=Sansita&family=Konkhmer+Sleokchher&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="logo">CVRaterAI</div>
        <div class="nav-links">
            <a href="../../index.html">Home</a>
            <a href="pricing.html">Pricing</a>
            <a href="features.html">Features</a>
        </div>
        <div class="nav-buttons">
            <button class="sign-in-btn active" onclick="window.location.href='signİn.html'">SIGN IN / SIGN UP</button>
            <button class="download-btn">
                <img src="../../images/google_play_logo.png" alt="Google Play">
                <span>Download</span>
            </button>
        </div>
    </nav>

    <main>
        <div class="container" id="container">
            <div class="form-container sign-up-container">
                <form action="#">
                    <h1>Create Account</h1>
                    <input type="text" placeholder="Name" />
                    <input type="text" placeholder="Surname" />
                    <input type="email" placeholder="Email" />
                    <input type="password" placeholder="Password" />
                    <button class="sign-up-btn">Sign Up</button>
                    <div class="or-divider">or</div>
                    <div class="social-container">
                        <a href="#" class="google"><img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google"></a>
                    </div>
                </form>
            </div>
            <div class="form-container sign-in-container">
                <form action="#">
                    <h1>Sign In</h1>
                    <input type="email" placeholder="Email" />
                    <input type="password" placeholder="Password" />
                    <button>Sign In</button>
                </form>
            </div>
            <div class="overlay-container">
                <div class="overlay">
                    <div class="overlay-panel overlay-left">
                        <h1>Welcome Back!</h1>
                        <p>Enter your personal information to use the site's features.</p>
                        <button class="ghost" id="signIn">Sign In</button>
                    </div>
                    <div class="overlay-panel overlay-right">
                        <h1>Hello Friend!</h1>
                        <p>Register with your personal information and access all the information on the site.</p>
                        <button class="ghost" id="signUp">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="background-elements">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
        <div class="circle circle-4"></div>
        <div class="circle circle-5"></div>
    </div>
    
    <script src="../../script.js"></script>
    <script src="../../src/js/signİn.js"></script>
    <script src="../../src/js/animations.js"></script>
</body>
</html>
