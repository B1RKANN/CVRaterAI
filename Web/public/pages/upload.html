<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVRaterAI</title>
    <link rel="stylesheet" href="../../src/css/upload.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="background-shapes">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <nav>
        <div class="logo">CVRaterAI</div>
        <div class="nav-links">
            <a href="#" class="nav-link active">Home</a>
            <a href="#" class="nav-link active">Pricing</a>
            <a href="#" class="nav-link active">Features</a>
        </div>
        <div class="nav-buttons">
            <button class="profile-btn">
                <img src="profile_icon.png" alt="Profile" class="profile-icon">
                Profile
            </button>
            <button class="download-btn">
                <img src="play_store_icon.png" alt="Google Play" class="play-store-icon">
                Download
            </button>
        </div>
    </nav>

    <div class="content">
        <div class="upload-section">
            <div class="upload-box">
                <h2>Drag And Drop CV</h2>
                <p>-OR-</p>
                <button class="upload-btn">Upload</button>
            </div>
        </div>

        <div class="form-section">
            <div class="input-group">
                <h3>Aranan Özellikler</h3>
                <textarea placeholder="B1 seviye ingilizce java spring boot c++ ve c# bilgisi olsun ekip ile uyumlu çalışsın"></textarea>
            </div>

            <div class="input-group">
                <h3>GitHub Linki (Opsiyonel)</h3>
                <input type="text" placeholder="https://github.com/BIRKANN">
            </div>
        </div>
    </div>
    
    <div class="analyze-btn-wrapper">
        <button class="analyze-btn">Analyze CV</button>
    </div>

    <script src="../../src/js/upload.js"></script>
</body>
</html>
