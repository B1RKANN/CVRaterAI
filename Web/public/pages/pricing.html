<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVRaterAI - Fiyatlandırma</title>
    <link rel="stylesheet" href="../../src/css/pricing.css">
</head>
<body>
    <div class="background-circles">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <nav class="navbar">
        <div class="logo">CVRaterAI</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Pricing</a>
            <a href="#">Features</a>
        </div>
        <div class="nav-buttons">
            <button class="sign-button">SIGN IN / SIGN UP</button>
            <button class="download-button">
                <img src="play-icon.svg" alt="Download" class="download-icon">
                Download
            </button>
        </div>
    </nav>

    <main class="pricing-container">
        <div class="cards-container">
            <div class="container-circles">
                <div class="container-circle container-circle-1"></div>
                <div class="container-circle container-circle-2"></div>
                <div class="container-circle container-circle-3"></div>
                <div class="container-circle container-circle-4"></div>
                <div class="container-circle container-circle-5"></div>
                <div class="container-circle container-circle-6"></div>
                <div class="container-circle container-circle-7"></div>
            </div>
            <h1>Pricing</h1>
            <p class="subtitle">Choose the plan that works for you</p>
            <div class="pricing-cards">
                <div class="pricing-card free">
                    <div class="card-circles">
                        <div class="card-circle circle-sm"></div>
                        <div class="card-circle circle-md"></div>
                    </div>
                    <h2>Free</h2>
                    <ul>
                        <li>20 credits per week</li>
                    </ul>
                    <button class="get-started">Get Started</button>
                </div>

                <div class="pricing-card pro">
                    <div class="card-circles">
                        <div class="card-circle circle-sm"></div>
                        <div class="card-circle circle-md"></div>
                    </div>
                    <h2>PRO</h2>
                    <ul>
                        <li><span class="price-amount">$5</span>/month Unlimited credit</li>
                    </ul>
                    <button class="buy-now">Buy Now</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
