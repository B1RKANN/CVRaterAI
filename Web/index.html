<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVRaterAI - AI-Powered CV Analysis Platform</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&family=Sansita&family=Konkhmer+Sleokchher&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="logo">CVRaterAI</div>
        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>
        <div class="nav-buttons">
            <button class="sign-in-btn">SIGN IN / SIGN UP</button>
            <button class="download-btn">
                <img src="../images/google_play_logo.png" alt="Google Play">
                <span>Download</span>
            </button>
        </div>
    </nav>

    <main>
        <div class="hero-section">
            <div class="balloon balloon-1"></div>
            <div class="balloon balloon-2"></div>
            <div class="balloon balloon-3"></div>
            <h1>AI-Powered CV Analysis Platform</h1>
            <p>Find the right candidate faster!<br>Analyze CVs with AI and optimize your hiring process.</p>
            <div class="hero-buttons">
                <button class="get-started-btn">Get Started</button>
                <button class="download-btn">Download</button>
            </div>
        </div>

        <div class="fast-simple">
            <div class="bubble bubble-1"></div>
            <div class="bubble bubble-2"></div>
            <div class="bubble bubble-3"></div>
            <h2>Fast and Simple!</h2>
        </div>

        <div class="steps-section">
            <div class="step-card">
                <span class="step-number">1.Step</span>
                <div class="step-content">
                    <img src="../images/direct-download.png" alt="Upload">
                    <h3>Upload Your Cv</h3>
                </div>
            </div>
            <div class="step-card">
                <span class="step-number">2.Step</span>
                <div class="step-content">
                    <img src="../images/artificial-intelligence.png" alt="AI Analysis">
                    <h3>Start AI Analysis</h3>
                </div>
            </div>
            <div class="step-card">
                <span class="step-number">3.Step</span>
                <div class="step-content">
                    <img src="../images/analysis.png" alt="Results">
                    <h3>Analysis Results</h3>
                </div>
            </div>
        </div>

        
    </main>

    <div class="background-elements">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
        <div class="circle circle-4"></div>
        <div class="circle circle-5"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
