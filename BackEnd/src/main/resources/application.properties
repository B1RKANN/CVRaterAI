spring.application.name=cvraterai

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.jpa.properties.hibernate.default_schema=cvraterai
spring.datasource.username=postgres
spring.datasource.password=12345
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Scheduler ayarları
spring.task.scheduling.pool.size=5
spring.task.execution.pool.max-size=10

# Loglama seviyelerini ayarla
logging.level.root=INFO
logging.level.com.birkann=DEBUG
logging.level.com.birkann.service.impl.UserService=DEBUG
logging.level.com.birkann.controller.CVEvaluationController=DEBUG
logging.level.com.birkann.jwt.JWTAuthenticaterFilter=DEBUG
logging.level.org.springframework.security=DEBUG

# Log formatını düzenle
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Performans ayarları
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Dosya yükleme ayarları
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=./uploads

# Gemini API ayarları
gemini.api.key=AIzaSyDyUAJK7t3bJ72YbLrHjrCgyD1v99ijTZQ
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

