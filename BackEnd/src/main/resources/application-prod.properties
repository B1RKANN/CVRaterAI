spring.application.name=cvraterai

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://db:5432/cvraterai
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.username=cvrateruser
spring.datasource.password=CVRaterAI_2025_Secure_DB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Scheduler ayarları
spring.task.scheduling.pool.size=5
spring.task.execution.pool.max-size=10

# Loglama seviyelerini ayarla
logging.level.root=INFO
logging.level.com.birkann=DEBUG
logging.level.com.birkann.jwt.JWTAuthenticaterFilter=DEBUG
logging.level.com.birkann.handler.AuthEntryPoint=DEBUG
logging.level.com.birkann.config.SecurityConfig=DEBUG
logging.level.org.springframework.security=DEBUG

# Log formatını düzenle
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Performans ayarları
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Dosya yükleme ayarları
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=/app/uploads

# Gemini API ayarları
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# JWT ayarları
jwt.secret=${JWT_SECRET}
jwt.refreshExpirationDateInMs=604800000

# Timeout ayarları
spring.mvc.async.request-timeout=180000
server.tomcat.connection-timeout=180000
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.connection-timeout=180000
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB 